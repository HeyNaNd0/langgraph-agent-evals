apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels: {app: reports}
spec:
  replicas: 2
  selector:
    matchLabels: {app: reports}
  template:
    metadata:
      labels: {app: reports}
    spec:
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reports
          image: ghcr.io/example/reports:1.0.3
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: host-root, mountPath: /host}
      volumes:
        - name: host-root
          hostPath: {path: /}
