apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: {app: notifier}
spec:
  replicas: 2
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notifier
          image: ghcr.io/example/notifier:2.3.1
          ports:
            - containerPort: 8080
          env:
            - name: SMTP_PASSWORD
              value: "hunter2"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
